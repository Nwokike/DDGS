[project]
name = "ddgs-app"
version = "2.0.0"
description = "DDGS — Dux Distributed Global Search. Privacy-first metasearch across 10 engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    # Directly imported by src/ (ai_service, license_service, update_service).
    # httpx is also a base flet dependency, so this pins the floor without
    # adding a family.
    "httpx>=0.28.1",
    # Imported by src/services/agent_files.py. Ceiling rule (owner's own
    # builds): pypi.flet.dev tops out at lxml 6.1.1 while PyPI has 6.1.3 -
    # never raise this floor past the Android ceiling or only the APK job
    # dies with "No matching distribution found".
    "lxml>=6.1.1",
    # Imported by src/services/media_downloader.py and youtube/innertube_client.py.
    # Floor matches ddgs' own requirement so the two cannot diverge.
    "primp>=1.3.1",
]

[tool.flet]
org = "ng.kiri"
product = "DDGS"
company = "Kiri Research Labs"
build_number = 6

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
startup_message = "Initializing DDGS..."

[tool.flet.android]
bundle_id = "ng.kiri.ddgs"
# Loopback hop to the embedded Kiri router (127.0.0.1) — KTV Player precedent.
usesCleartextTraffic = "true"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~2413783608"

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    # `uv run flet run` / `flet build` need flet-cli + flet-desktop, which
    # flet otherwise pip-installs into the venv at runtime. Kept OUT of
    # [project].dependencies so `flet build` never resolves desktop packages
    # for Android. Exact pin: the extras must track the flet SDK version.
    "flet[cli,desktop]==1.0.1",
]

[tool.ruff]
lint.extend-ignore = ["BLE001", "S110"]
# Vendored Kiri Router (src/services/router/run.py) is third-party code —
# keep it byte-identical to kiri-router/dist-scripts/run.py.
lint.per-file-ignores = { "src/services/router/run.py" = ["ALL"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
