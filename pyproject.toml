[project]
name = "ddgs-app"
version = "2.0.0"
description = "DDGS — Dux Distributed Global Search. Privacy-first metasearch across 10 engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Two indexes, two ceilings. `flet build` installs against PyPI plus
    # --extra-index-url https://pypi.flet.dev, and the second index is the
    # only one carrying Android wheels. Desktop takes the newest PyPI has
    # (cryptography 50.x, lxml 6.1.3); Android takes the newest Flet has
    # (48.0.0 and 6.1.1). A floor above an index's ceiling resolves on
    # Windows and Linux and matches nothing at all on Android, so pip
    # reports "No matching distribution found" and only the APK job dies —
    # which is how two jobs looked green while the release stayed empty.
    # Neither floor may be raised past its Android ceiling without checking
    # pypi.flet.dev first. The APIs in use (SPKI public-key load,
    # encode_dss_signature, ECDSA over SHA-256; lxml.etree/lxml.html) are
    # unchanged across both ranges.
    "cryptography>=43.0.1",
    "ddgs>=9.16.0",
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
]

[tool.flet]
org = "ng.kiri"
product = "DDGS"
company = "Kiri Research Labs"
build_number = 6

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
startup_message = "Initializing DDGS..."

[tool.flet.android]
bundle_id = "ng.kiri.ddgs"
# Loopback hop to the embedded Kiri router (127.0.0.1) — KTV Player precedent.
usesCleartextTraffic = "true"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~2413783608"

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
lint.extend-ignore = ["BLE001", "S110"]
# Vendored Kiri Router (src/services/router/run.py) is third-party code —
# keep it byte-identical to kiri-router/dist-scripts/run.py.
lint.per-file-ignores = { "src/services/router/run.py" = ["ALL"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
