[project]
name = "ddgs-app"
version = "1.2.0"
description = "DDGS — Dux Distributed Global Search. Privacy-first metasearch across 14 engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "flet>=0.86.5",
    "flet-ads>=0.86.5",
]

[tool.flet]
org = "ng.kiri"
product = "DDGS"
company = "Kiri Research Labs"
build_number = 3

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
startup_message = "Initializing DDGS..."

[tool.flet.android]
bundle_id = "ng.kiri.ddgs"
extract_packages = ["fake_useragent"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~2413783608"

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"
[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
lint.extend-ignore = ["BLE001", "S110"]
