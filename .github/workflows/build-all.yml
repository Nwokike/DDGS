name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.1.0"
      build_number:
        description: "Build number"
        required: true
        default: "9"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.12"
  BUILD_VERSION: ${{ inputs.build_version || '2.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '9' }}

jobs:
  # ─── 0. Quality gate: nothing builds or publishes until this passes ────
  # KTV Player gates every job behind ruff + pytest; DDGS ran neither in CI
  # on any branch, so local tests guarded exactly nothing — including
  # the Play-channel assertions that only run on the playstore branch.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert playstore divergence (two files only)
        run: |
          # The branches agree everywhere except the AAB job and the
          # YouTube policy block. Anything else in the diff means one
          # branch drifted; fail loudly instead of shipping the drift.
          git fetch --depth=1 origin main playstore || true
          diff_files="$(git diff --name-only origin/main origin/playstore 2>/dev/null || true)"
          extra="$(printf '%s\n' "$diff_files" | sort -u | grep -v -x \
            -e '.github/workflows/build-all.yml' \
            -e 'src/components/results/downloader.py' || true)"
          if [ -n "$extra" ]; then
            echo "::error::playstore diverges beyond the two allowed files:"
            echo "$extra"
            exit 1
          fi
          echo "playstore divergence is exactly the two allowed files"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (frozen lockfile, includes dev group)
        run: uv sync --frozen
      - name: Version consistency (pyproject is the source; version.json may be held back)
        run: |
          uv run python - <<'PY'
          import json, os, re, sys, tomllib

          pp = tomllib.load(open("pyproject.toml", "rb"))
          py = pp["project"]["version"]
          felb = str(pp["tool"]["flet"]["build_number"])
          sys.path.insert(0, "src")
          from components.settings.version import _APP_VERSION
          from services import update_service as us
          from services.reasoning import USER_AGENT

          env_v, env_b = os.environ["BUILD_VERSION"], os.environ["BUILD_NUMBER"]
          errs = []

          # Hard: the artifact's version/build and every derived in-app copy
          # agree with pyproject, which is the single source of truth.
          if env_v != py:
              errs.append(f"BUILD_VERSION {env_v!r} != pyproject {py!r}")
          if str(env_b) != felb:
              errs.append(f"BUILD_NUMBER {env_b!r} != tool.flet.build_number {felb!r}")
          if _APP_VERSION != py:
              errs.append(f"settings.version._APP_VERSION {_APP_VERSION!r} != pyproject {py!r}")
          if us._APP_VERSION != py or str(us._APP_BUILD) != felb:
              errs.append(f"update_service {_APP_VERSION}/{us._APP_BUILD} != {py}/{felb}")
          if USER_AGENT != f"DDGSApp/{py}":
              errs.append(f"USER_AGENT {USER_AGENT!r} != 'DDGSApp/{py}'")

          # Hard: this workflow's own hand-typed defaults and env fallbacks.
          wf = open(".github/workflows/build-all.yml", encoding="utf-8").read()
          defaults = re.findall(r'^\s+default: "([^"]+)"', wf, re.MULTILINE)
          if len(defaults) != 2 or defaults[0] != py or defaults[1] != felb:
              errs.append(f"workflow input defaults {defaults!r} != [{py!r}, {felb!r}]")
          fallbacks = re.findall(r"\|\| '([^']+)'", wf)
          if fallbacks != [py, felb]:
              errs.append(f"workflow env fallbacks {fallbacks!r} != [{py!r}, {felb!r}]")

          # Hard: the literal fallbacks in app code (reachable exactly when
          # pyproject is unreadable, which is when they must be right).
          def literals(path, name, cast=str):
              hits = re.findall(
                  rf'{name} = ("[^"]+"|\d+)', open(path, encoding="utf-8").read()
              )
              return [cast(h.strip(chr(34))) for h in hits]

          v_fall = literals("src/components/settings/version.py", "_APP_VERSION")
          if not v_fall or v_fall[-1] != py:
              errs.append(f"version.py fallback {v_fall!r} does not end at {py!r}")
          u_fall = literals("src/services/update_service.py", "_APP_VERSION")
          if not u_fall or u_fall[-1] != py:
              errs.append(f"update_service fallback {u_fall!r} does not end at {py!r}")
          b_fall = literals("src/services/update_service.py", "_APP_BUILD", int)
          if not b_fall or b_fall[-1] != int(felb):
              errs.append(f"update_service build fallback {b_fall!r} does not end at {felb}")

          # version.json: behind = the owner's hold (expected until the Play
          # AAB ships); synced must match the build; ahead is impossible.
          vj = json.load(open("version.json"))
          def vt(s):
              return tuple(int(x) for x in s.split("."))

          vj_v = vj["version"]
          if vj_v == py:
              if str(vj["build_number"]) != felb:
                  errs.append(
                      f"version.json synced to {vj_v} but build_number "
                      f"{vj['build_number']} != {felb}"
                  )
              else:
                  print(f"versions synced: {py} (build {felb})")
          elif vt(vj_v) < vt(py):
              print(
                  f"NOTICE: version.json held back at {vj_v} "
                  f"(build {vj['build_number']}) while app is {py} - "
                  "expected until the Play Store AAB upload, then commit version.json."
              )
          else:
              errs.append(
                  f"version.json {vj_v} is AHEAD of pyproject {py} - update notes "
                  "point at an app version that does not exist"
              )

          if errs:
              print("Version drift:", file=sys.stderr)
              print("\n".join(f"  - {e}" for e in errs), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Ruff
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q

  # ─── 1. Create Release Tag & Placeholder ───────────────
  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=DDGS ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            **Search everything. Download anything.**

            Private search across 10 engines: download videos and images, scrape any page as Markdown, HTML or text, no account, no tracking.

            ## 2.1.0 - the Assistant runs on kani

            - **A real agent engine**: the chat loop is now [kani](https://github.com/zhudotexe/kani)'s `full_round` - our own wrapper builds the engine, the tools and the error mapping. Reasoning capture rides kani's own SSE surface, so the Thinking block shows real reasoning again.
            - **The router is the only source**: the api.kiri.ng gateway fallback and all hand-rolled SSE parsing are gone. Requests go to the embedded Kiri router, the model string is passed through untouched, and a 429/5xx/connection break keeps its exact honest words.
            - **Exact token receipts**: every paid reply reports the real token count the stream returned, beside its steps and credits.
            - **Thinking depth**: Auto / Fast / Deep in Settings, with a warm prompt cache for the system prompt and tools.
            - **Exports and imports**: any chat writes a `.kani` archive from the chat list, and `.kani`/JSON archives import back as a new conversation.

            ## The rest of the grind

            - **Undo everywhere**: deleting a chat, clearing a chat, deleting a message exchange or clearing search history all offer an Undo.
            - **Quick actions**: long-press (mobile) or right-click (desktop) any result row for open / copy link / share; the detail sheet's image preview pinch-zooms, and a QR button hands the link to your phone.
            - **Load more**: results no longer stop at twenty - fetch the next page, deduped and appended.
            - **Every network path honors your proxy**: downloads, YouTube, updates, license checks and the engine fetch, not just search.
            - **Crawl schedules you can edit**: a six-preset interval picker in Settings, and finished saves buzz and share on mobile.
            - **Desktop polish**: Esc closes dialogs, Ctrl+K jumps to search, and the Android splash matches the app's own surfaces.
            - **Correctness**: notification bars can no longer stay on screen and block every tap, foreign URL schemes never reach a fetch or the OS, punycode hosts read as real names, YouTube's JS parser has backtracking circuit-breakers, and the Android CI job can no longer run out of memory.

            ## The core, still the point

            - YouTube video downloads with quality picker (best/1080p/720p/480p/360p)
            - Image downloads with save dialog, progress and cancel
            - Any URL to Markdown / HTML / rich text / plain text / raw source, saved to file
            - Share, copy or open every result in one tap

            *The Play Store edition blocks YouTube downloads for Play policy: this GitHub build is the full version. Feature comparison in the README.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Flutter 3.24.3 is what flet_cli hardcodes; without this every job
      # re-downloads the SDK + engine artifacts (~1-2 GB, minutes each).
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.24.3-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flutter-3.24.3-${{ runner.os }}-
      - name: Cache flet templates
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-tpl-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flet-tpl-${{ runner.os }}-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile binary wheels (primp, ddgs)
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          pip install wheel
          uv export --no-dev --format requirements-txt | pip wheel -r /dev/stdin --no-deps -w ${{ github.workspace }}/wheels 2>/dev/null || true
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build apk --yes --project ddgs --product "DDGS" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Windows (Automated .exe Setup Installer) ──────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Flutter 3.24.3 is what flet_cli hardcodes; without this every job
      # re-downloads the SDK + engine artifacts (~1-2 GB, minutes each).
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.24.3-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flutter-3.24.3-${{ runner.os }}-
      - name: Cache flet templates
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-tpl-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flet-tpl-${{ runner.os }}-

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project ddgs --product "DDGS" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{C72B91A4-2849-4E62-8F91-92A83827C4E1}}
          AppName=DDGS
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri Research Labs
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri Research Labs
          DefaultDirName={autopf}\DDGS
          DefaultGroupName=DDGS
          OutputDir=.\build\installer
          OutputBaseFilename=DDGS
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\ddgs.exe
          CloseApplications=yes
          AppMutex=DDGS_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\DDGS"; Filename: "{app}\ddgs.exe"
          Name: "{autodesktop}\DDGS"; Filename: "{app}\ddgs.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/DDGS.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Flutter 3.24.3 is what flet_cli hardcodes; without this every job
      # re-downloads the SDK + engine artifacts (~1-2 GB, minutes each).
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.24.3-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flutter-3.24.3-${{ runner.os }}-
      - name: Cache flet templates
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-tpl-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flet-tpl-${{ runner.os }}-
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run flet build linux --yes --project ddgs --product "DDGS" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/DDGS.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/ddgs pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/ddgs/
          chmod +x pkg_root/usr/lib/ddgs/ddgs
          ln -s /usr/lib/ddgs/ddgs pkg_root/usr/bin/ddgs

          # Icons
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/ddgs.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/ddgs.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/ddgs.desktop
          [Desktop Entry]
          Version=1.0
          Name=DDGS
          GenericName=Privacy-First Metasearch Engine
          Comment=Search everything. Download anything. — Private search across 10 engines with downloads and page scraping
          Exec=/usr/bin/ddgs
          Icon=ddgs
          Terminal=false
          Type=Application
          Categories=Utility;Network;WebBrowser;
          Keywords=Search;Privacy;DuckDuckGo;Google;Brave;Metasearch;
          StartupNotify=true
          StartupWMClass=ddgs
          EOF

          # AppStream / AppData metainfo XML
          cat <<EOF > pkg_root/usr/share/metainfo/ng.kiri.ddgs.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>ng.kiri.ddgs</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>DDGS</name>
            <summary>Search everything. Download anything. — private search across 10 providers</summary>
            <description>
              <p>DDGS (Dux Distributed Global Search) — private multi-source search, downloads, and page scraping:</p>
              <ul>
                <li>Simultaneous query aggregation across 10 search providers</li>
                <li>Web, image, video, news, and book search modes</li>
                <li>Video and image downloads with quality selection</li>
                <li>Scrape any URL as Markdown, HTML, plain text, or raw source and save it</li>
                <li>No account, local-only storage and history</li>
              </ul>
            </description>
            <launchable type="desktop-id">ddgs.desktop</launchable>
            <url type="homepage">https://kiri.ng</url>
            <developer_name>Kiri Research Labs</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n ddgs -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "Search everything. Download anything. — private search across 10 engines with downloads and page scraping." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "utils" \
              -p build/dist/DDGS.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n ddgs -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "Search everything. Download anything. — private search across 10 engines with downloads and page scraping." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "Utility" \
              -p build/dist/DDGS.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android AAB (Play Store) ──────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile binary wheels (primp, ddgs)
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          pip install wheel
          uv export --no-dev --format requirements-txt | pip wheel -r /dev/stdin --no-deps -w ${{ github.workspace }}/wheels 2>/dev/null || true
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Stamp the Play channel (free-only build)
        # The AAB uploaded to Google Play carries CHANNEL = "play": it sells
        # nothing, shows no premium purchase UI, and makes no request to the
        # licence Worker. Selling in-app digital goods there needs a Google
        # Payments merchant profile, which no account available to us has yet.
        # The direct APK, desktop and web builds keep CHANNEL = "direct" and
        # offer Flutterwave. One line, decided before the build, so the
        # policy is baked into the artifact rather than decided at runtime.
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          p = Path("src/core/build_channel.py")
          p.write_text(p.read_text(encoding="utf-8").replace(
              'CHANNEL = "direct"', 'CHANNEL = "play"'), encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PYEOF
      - name: Build AAB (Play Store)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build aab --yes --project ddgs --product "DDGS" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          # flet 1.0.1 outputs the bundle as build/aab/ddgs.aab. The merge
          # carried main's APK glob here, so the AAB job uploaded nothing
          # while reporting success; failOnUnmatchedFiles makes a wrong
          # glob a hard error from now on.
          files: build/aab/*.aab
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

